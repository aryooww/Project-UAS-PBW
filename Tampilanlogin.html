<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groceer - Login Reseller</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
<div class="container-fluid px-3 px-sm-4 py-4">
    <div class="row justify-content-center">
        <!-- col responsif: penuh di HP, menyempit di tablet & laptop -->
        <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="logo-circle mx-auto mb-2">G</div>
                <h1 class="fs-3 fw-bold" style="color:#2e7d32;">
                Groceer <i class="bi bi-cart-fill"></i></h1>
            </div>

            <!-- FORM LOGIN -->
            <div id="loginCard" class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="fs-5 fw-semibold mb-0">Log In</h2>
                    <a href="#" id="helpBtnLogin" class="link-green small">Butuh bantuan?</a>
                </div>

                <div id="loginAlert" class="alert py-2 small d-none"></div>

                <div class="mb-3">
                    <input type="text" id="loginUsername" class="form-control" placeholder="No. Handphone / Username / Email">
                </div>
                <div class="mb-3">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Password">
                </div>

                <button class="btn btn-groceer w-100 fw-semibold mb-2" id="loginBtn">LOG IN</button>

                <div class="text-center mb-3">
                    <a id="forgotBtn" class="link-green small">Lupa Password</a>
                </div>

                <div class="divider mb-3">ATAU</div>

                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-outline-primary flex-fill" id="fbBtn">Facebook</button>
                    <button class="btn btn-outline-danger flex-fill" id="googleBtn">Google</button>
                </div>

                <p class="text-muted small text-center mb-2">
                    Dengan login, kamu menyetujui
                    <a href="#" class="link-green">Syarat & Ketentuan</a> dan
                    <a href="#" class="link-green">Kebijakan Privasi</a> Groceer.
                </p>

                <p class="text-center small mb-0">
                    Baru di Groceer? <a id="showRegisterLink" class="link-green fw-semibold">Daftar</a>
                </p>
            </div>

            <!-- FORM REGISTRASI -->
            <div id="registerCard" class="card border-0 shadow-sm rounded-4 p-3 p-md-4 d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="fs-5 fw-semibold mb-0">Daftar</h2>
                    <a href="#" id="helpBtnRegister" class="link-green small">Butuh bantuan?</a>
                </div>

                <div id="regAlert" class="alert py-2 small d-none"></div>

                <div class="mb-2">
                    <input type="text" id="regName" class="form-control" placeholder="Nama Lengkap">
                </div>
                <div class="mb-2">
                    <input type="text" id="regPhone" class="form-control" placeholder="No. Handphone">
                </div>
                <div class="mb-2">
                    <input type="email" id="regEmail" class="form-control" placeholder="Email">
                </div>
                <div class="mb-2">
                    <input type="password" id="regPassword" class="form-control" placeholder="Password (min. 6 karakter)">
                </div>
                <div class="mb-3">
                    <input type="password" id="regConfirm" class="form-control" placeholder="Konfirmasi Password">
                </div>

                <button class="btn btn-groceer w-100 fw-semibold mb-3" id="registerBtn">DAFTAR</button>

                <p class="text-muted small text-center mb-2">
                    Dengan mendaftar, kamu menyetujui
                    <a href="#" class="link-green">Syarat & Ketentuan</a> Groceer.
                </p>

                <p class="text-center small mb-0">
                    Sudah punya akun? <a id="showLoginLink" class="link-green fw-semibold">Log In</a>
                </p>
            </div>

        </div>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
