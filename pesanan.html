<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groceer - Pesanan Saya</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/pesanan.css">
</head>
<body>

  <header class="top-header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <span class="header-title">Pesanan Saya</span>
  </header>

  <!-- TAB STATUS -->
  <div class="tab-wrap">
    <div class="tab-inner">
      <button class="tab-btn active" onclick="gantiTab('semua',this)">Semua</button>
      <button class="tab-btn" onclick="gantiTab('Menunggu Pembayaran',this)">Menunggu</button>
      <button class="tab-btn" onclick="gantiTab('Diproses',this)">Diproses</button>
      <button class="tab-btn" onclick="gantiTab('Dikirim',this)">Dikirim</button>
      <button class="tab-btn" onclick="gantiTab('Selesai',this)">Selesai</button>
      <button class="tab-btn" onclick="gantiTab('Dibatalkan',this)">Dibatalkan</button>
    </div>
  </div>

  <div class="main" id="mainContent"></div>

  <nav class="bottom-nav">
    <div class="bn-item" onclick="window.location.href='dashboard.html'">
      <i class="fas fa-home"></i><span>Home</span>
    </div>
    <div class="bn-item active">
      <i class="fas fa-box"></i><span>Pesanan</span>
    </div>
    <div class="bn-item" onclick="window.location.href='cart.html'">
      <i class="fas fa-shopping-cart"></i><span>Keranjang</span>
    </div>
    <div class="bn-item" onclick="window.location.href='notifikasi.html'">
      <i class="fas fa-bell"></i><span>Notifikasi</span>
    </div>
  </nav>

  <div class="toast" id="toast"></div>

<script src="js/pesanan.js"></script>
</body>
</html>
